version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: english_learning
      DB_USERNAME: root
      DB_PASSWORD: ServBay.dev

  mysql:
    image: mysql:8.0
    container_name: mysql80
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ServBay.dev
      MYSQL_DATABASE: english_learning
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ServBay.dev
    depends_on:
      - mysql

volumes:
  mysql_data:
